# DanteGPU Platform - NATS Server Configuration
# JetStream enabled for persistent messaging and event streaming

# Server Configuration
server_name: "dantegpu-nats-1"
host: "0.0.0.0"
port: 4222

# HTTP Monitoring
http_port: 8222

# Client Connection Limits
max_connections: 10000
max_control_line: 4096
max_payload: 8388608  # 8MB
max_pending: 67108864  # 64MB

# Timeouts
ping_interval: "2m"
ping_max: 3
write_deadline: "10s"

# Logging
debug: false
trace: false
logtime: true
log_file: "/var/log/nats/nats-server.log"
log_size_limit: 104857600  # 100MB
max_traced_msg_len: 1024

# JetStream Configuration
jetstream {
    # Storage directory
    store_dir: "/data/nats/jetstream"
    
    # Maximum storage
    max_memory_store: 1GB
    max_file_store: 10GB
    
    # Sync settings
    sync_interval: "2m"
    sync_always: false
}

# Cluster Configuration (for high availability)
cluster {
    name: "dantegpu-cluster"
    host: "0.0.0.0"
    port: 6222
    
    # Routes to other NATS servers
    routes: [
        nats://nats-1:6222
        nats://nats-2:6222
        nats://nats-3:6222
    ]
    
    # Cluster authentication
    authorization {
        user: $NATS_CLUSTER_USER
        password: $NATS_CLUSTER_PASSWORD
        timeout: 2
    }
}

# Authentication
authorization {
    # User credentials
    users: [
        # System user for internal services
        {
            user: $NATS_SYSTEM_USER
            password: $NATS_SYSTEM_PASSWORD
            permissions: {
                publish: {
                    allow: [">"]
                }
                subscribe: {
                    allow: [">"]
                }
            }
        },
        
        # API Gateway user
        {
            user: $NATS_API_GATEWAY_USER
            password: $NATS_API_GATEWAY_PASSWORD
            permissions: {
                publish: {
                    allow: ["api.>", "events.>", "jobs.>"]
                }
                subscribe: {
                    allow: ["api.>", "events.>", "responses.>"]
                }
            }
        },
        
        # Provider Daemon user
        {
            user: $NATS_PROVIDER_USER
            password: $NATS_PROVIDER_PASSWORD
            permissions: {
                publish: {
                    allow: ["provider.>", "jobs.status.>", "metrics.>"]
                }
                subscribe: {
                    allow: ["jobs.assigned.>", "commands.>"]
                }
            }
        },
        
        # Scheduler user
        {
            user: $NATS_SCHEDULER_USER
            password: $NATS_SCHEDULER_PASSWORD
            permissions: {
                publish: {
                    allow: ["jobs.>", "scheduler.>"]
                }
                subscribe: {
                    allow: ["jobs.>", "provider.>"]
                }
            }
        },
        
        # Billing user
        {
            user: $NATS_BILLING_USER
            password: $NATS_BILLING_PASSWORD
            permissions: {
                publish: {
                    allow: ["billing.>", "payments.>"]
                }
                subscribe: {
                    allow: ["billing.>", "sessions.>", "jobs.>"]
                }
            }
        },
        
        # Monitoring user (read-only)
        {
            user: $NATS_MONITORING_USER
            password: $NATS_MONITORING_PASSWORD
            permissions: {
                publish: {
                    deny: [">"]
                }
                subscribe: {
                    allow: [">"]
                }
            }
        }
    ]
}

# TLS Configuration (for production)
# tls {
