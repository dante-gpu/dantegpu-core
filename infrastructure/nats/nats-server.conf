#     key_file: "/etc/nats/certs/server-key.pem"
#     ca_file: "/etc/nats/certs/ca.pem"
#     verify: true
#     timeout: 2
# }

# Limits
limits {
    max_subscriptions: 10000
    max_payload: 8388608  # 8MB
}

# System Account (for monitoring and management)
system_account: SYS

# Accounts (for multi-tenancy)
accounts {
    SYS: {
        users: [
            {user: $NATS_SYSTEM_USER, password: $NATS_SYSTEM_PASSWORD}
        ]
    }
    
    DANTEGPU: {
        jetstream: enabled
        users: [
            {user: $NATS_API_GATEWAY_USER, password: $NATS_API_GATEWAY_PASSWORD},
            {user: $NATS_PROVIDER_USER, password: $NATS_PROVIDER_PASSWORD},
            {user: $NATS_SCHEDULER_USER, password: $NATS_SCHEDULER_PASSWORD},
            {user: $NATS_BILLING_USER, password: $NATS_BILLING_PASSWORD}
        ]
    }
}

