apiVersion: v1
kind: Namespace
metadata:
  name: dantegpu-staging
  labels:
    name: dantegpu-staging
    environment: staging
    managed-by: kubectl
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dantegpu-staging-quota
  namespace: dantegpu-staging
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    requests.storage: 100Gi
    persistentvolumeclaims: "10"
    pods: "50"
    services: "20"
    secrets: "50"
    configmaps: "50"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: dantegpu-staging-limits
  namespace: dantegpu-staging
spec:
  limits:
  - max:
      cpu: "4"
      memory: 8Gi
    min:
      cpu: "100m"
      memory: 128Mi
    default:
      cpu: "500m"
      memory: 512Mi
    defaultRequest:
      cpu: "250m"
      memory: 256Mi
    type: Container
  - max:
      cpu: "8"
      memory: 16Gi
    min:
      cpu: "200m"
      memory: 256Mi
    type: Pod

