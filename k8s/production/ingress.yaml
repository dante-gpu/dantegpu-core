apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dantegpu-ingress
  namespace: dantegpu-production
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://dantegpu.com,https://www.dantegpu.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
spec:
  tls:
  - hosts:
    - dantegpu.com
    - www.dantegpu.com
    - api.dantegpu.com
    secretName: dantegpu-tls
  rules:
  - host: api.dantegpu.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway-service
            port:
              number: 8000
  - host: dantegpu.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gpu-rental-frontend-service
            port:
              number: 80
  - host: www.dantegpu.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gpu-rental-frontend-service
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dantegpu-provider-ingress
  namespace: dantegpu-production
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - provider.dantegpu.com
    secretName: dantegpu-provider-tls
  rules:
  - host: provider.dantegpu.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: provider-web-app-service
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dantegpu-monitoring-ingress
  namespace: dantegpu-production
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: monitoring-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required'
spec:
  tls:
  - hosts:
    - grafana.dantegpu.com
    - prometheus.dantegpu.com
    secretName: dantegpu-monitoring-tls
  rules:
  - host: grafana.dantegpu.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana-service
            port:
              number: 3000
  - host: prometheus.dantegpu.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prometheus-service
            port:
              number: 9090
---
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-basic-auth
  namespace: dantegpu-production
type: Opaque
data:
  # admin:admin (change in production)
  # Generated with: htpasswd -nb admin admin | base64
  auth: YWRtaW46JGFwcjEkSDY1dnBkTU8kSGJyWE5CRmtJSC5lQnhkRmRGRjBkLgo=
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@dantegpu.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - http01:
        ingress:
          class: nginx

